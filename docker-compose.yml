version: "3.8"

services:
  sentineliq:
    build: .
    container_name: sentineliq-app
    restart: unless-stopped
    ports:
      - "80:8501"
    env_file:
      - .env
    volumes:
      - app-data:/app/data
      - pattern-store:/app/pattern_store.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
  pattern-store:
