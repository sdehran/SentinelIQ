services:
  sentineliq:
    image: sentineliq-app
    container_name: sentineliq-app
    restart: unless-stopped
    ports:
      - "80:8501"
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
